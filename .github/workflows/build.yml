name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    # macOS runner is free for public repositories
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ExpiryScan.xcodeproj \
            -scheme ExpiryScan \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "app: $APP"
          test -n "$APP"
          rm -rf Payload ExpiryScan.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ExpiryScan.ipa Payload
          ls -lh ExpiryScan.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpiryScan-unsigned-ipa
          path: ExpiryScan.ipa
          if-no-files-found: error
